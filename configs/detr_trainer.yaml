# pytorch_lightning==2.5.6
trainer:
  devices:
    - 0
  precision: bf16-mixed
  callbacks:
    - class_path: "pytorch_lightning.callbacks.ModelCheckpoint"
      init_args:
        monitor: "loss/val"
        mode: "min"
        filename: "best"
        save_last: true
  max_epochs: 300
  accumulate_grad_batches: 6
  check_val_every_n_epoch: 5
model:
  class_path: model.lightning_detr.LightningDETR